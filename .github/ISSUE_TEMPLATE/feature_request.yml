name: Feature request
description: Suggest an idea for bunkeeper
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what got in your way?
      placeholder: I'm trying to ... but ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like bunkeeper to do? Include example config or CLI output if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or config you tried.
  - type: checkboxes
    id: philosophy
    attributes:
      label: Zero-dependency check
      description: bunkeeper ships no runtime dependencies — features must work with the bun toolchain alone.
      options:
        - label: This feature can be implemented without adding runtime dependencies to bunkeeper.
          required: true
