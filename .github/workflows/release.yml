name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./packages/bunkeeper/package.json').version)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/bunkeeper version $PKG_VERSION. Bump the version (or fix the tag) and try again."
            exit 1
          fi
          echo "Releasing bunkeeper@$PKG_VERSION"

      - name: Check (fmt, lint, test)
        run: |
          bun fmt --check
          bun lint --no-script --max-warnings 0
          bun test

      - name: Package dry-run
        working-directory: packages/bunkeeper
        run: bun pm pack --dry-run

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm (trusted publishing via OIDC)
        working-directory: packages/bunkeeper
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "bunkeeper@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "bunkeeper@$PKG_VERSION is already on npm — skipping publish"
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — skipping"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
